<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festinha</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <div id="app">
    <aside>
      <div class="aside-container">
        <header>
          <img src="assets/imgs/Logo.svg" alt="logo de festa">
          <h2 class="logo">Festivite</h2>
          <p class="txt-light">Crie um convite digital para o seu evento</p>
        </header>

      </div>
    </aside>

    <main>
      <div class="main-container">
        <h1>Crie seu convite</h1>

        <form action="" method="post" enctype="multipart/form-data">
          <fieldset class="about-info">
            
            <legend>
              <img src="assets/icons/calendar.svg" alt="">
              <span class="txt-h2">Sobre o evento</span>
            </legend>

            <div class="input-wrapper">
              <label for="title">Título</label>
              <input 
              name="title" 
              id="title" 
              type="text"
              placeholder="Nome do evento">
            </div>

            <div class="input-wrapper grid-columns">
              <div class="input-inner">
                <label for="dateStart">Início</label>
                <input type="datetime-local" id="dateStart" type="dateStart" name="dateStart" lang="pt-BR">
              </div>

              <div class="input-inner">
                <label for="dateEnd">Fim</label>
                <input type="datetime-local" id="dateEnd" type="dateEnd" name="dateEnd" lang="pt-BR">
              </div>
            </div>

            <div class="radio-wrapper">
              <div class="radio-inner">
                <label>Tipo</label>
                <div class="radio-container">
                  <div class="radio-select">
                    <input type="radio" name="meet-type" value="online" id="online" checked>
                    <div class="radio-content">
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.333 1.834a.833.833 0 0 0-.833.833v11.5h7v-11.5a.833.833 0 0 0-.833-.833zM12.5 5.5V2.667A1.833 1.833 0 0 0 10.667.833H5.333A1.833 1.833 0 0 0 3.5 2.667V7.5h-.833A1.833 1.833 0 0 0 .833 9.334v4a1.834 1.834 0 0 0 1.834 1.833h10.666a1.833 1.833 0 0 0 1.834-1.833v-6A1.833 1.833 0 0 0 13.333 5.5zm0 1v7.667h.833a.834.834 0 0 0 .834-.833v-6a.833.833 0 0 0-.834-.834zm-9 2h-.833a.833.833 0 0 0-.834.834v4a.833.833 0 0 0 .834.833H3.5zM6.167 4a.5.5 0 0 1 .5-.5h2.666a.5.5 0 0 1 0 1H6.667a.5.5 0 0 1-.5-.5m0 2.667a.5.5 0 0 1 .5-.5h2.666a.5.5 0 0 1 0 1H6.667a.5.5 0 0 1-.5-.5m0 2.667a.5.5 0 0 1 .5-.5h2.666a.5.5 0 1 1 0 1H6.667a.5.5 0 0 1-.5-.5m0 2.666a.5.5 0 0 1 .5-.5h2.666a.5.5 0 1 1 0 1H6.667a.5.5 0 0 1-.5-.5" fill="currentColor"/></svg>
                      <label for="meet-type">Presencial</label>
                    </div>
                  </div>
                  <div class="radio-select">
                    <input type="radio" name="meet-type" value="presencial" id="presencial">
                    <div class="radio-content">
                      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.667 4.5a.833.833 0 0 0-.834.833v5.334c0 .46.373.833.834.833h6.666c.46 0 .834-.373.834-.833V5.333a.833.833 0 0 0-.834-.833zm8.5 1.63v-.797A1.834 1.834 0 0 0 9.333 3.5H2.667C1.654 3.5.833 4.32.833 5.333v5.334c0 1.012.821 1.833 1.834 1.833h6.666c1.013 0 1.834-.82 1.834-1.833V9.6l2.705 1.803a.833.833 0 0 0 1.295-.693V5.247a.833.833 0 0 0-1.254-.72zm0 1.157V8.4l3 2V5.537z" fill="currentColor"/></svg>
                      <label for="meet-type">Online</label>
                    </div>
                  </div>
                </div>
              </div>

              <div class="input-wrapper">
                <label for="place-link">Local</label>
                <input type="url" name="place-link" id="place-link" placeholder="Link ou endereço">
              </div>
            </div>


            <div class="txtArea-wrapper">
              <label for="description">Descrição</label>
              <textarea name="medical-info" id="medical-info"
              cols="30" rows="10"
              placeholder="Escreva sobre os detalhes do evento"
              ></textarea>
            </div>
          </fieldset>

          <fieldset>
            <legend>
              <img src="assets/icons/paintbrush-vertical.svg" alt="">
              <span class="txt-h2">Personalização</span>
            </legend>

            <div class="color-selection">
              <label>Cor principal</label>

              <div class="color-picker">
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="blue" checked>
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="navy">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="purple">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="fuschia">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="pink">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="red">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="orange">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="yellow">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="lime">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="green">
                  <span class="circle"></span>
                </div>
                
                <div class="color-option">
                  <input class="color-selection" type="radio" name="main-color" id="cyan">
                  <span class="circle"></span>
                </div>

              </div>

            </div>

            <div class="theme-selection">
              <label>Tema do evento</label>

              <div class="theme-grid">
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="aniversario" checked>
                  <div class="card-content">
                    <img src="assets/imgs/Image_4.png" alt="imagem de um bolo com vela de aniversário">
                    <p>Aniverário</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="kids">
                  <div class="card-content">
                    <img src="assets/imgs/Image_2.png" alt="mesa com bolo e enfeites de festa infantil">
                    <p>Infantil</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="graduate">
                  <div class="card-content">
                    <img src="assets/imgs/Image_5.png" alt="imagem de um chapéu de formatura">
                    <p>Formatura</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="wedding">
                  <div class="card-content">
                    <img src="assets/imgs/Image_3.png" alt="imagem de alianças de casamento">
                    <p>Casamento</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="baby-reveal">
                  <div class="card-content">
                    <img src="assets/imgs/Image.png" alt="imagem de toalhas umedecidas">
                    <p>Chá de bebê</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="wedding-shower">
                  <div class="card-content">
                    <img src="assets/imgs/Image_6.png" alt="imagem de um conjunto de panelas">
                    <p>Chá de panela</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="carnival">
                  <div class="card-content">
                    <img src="assets/imgs/Image_7.png" alt="imagem de confetes de carnaval">
                    <p>Carnaval</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="easter">
                  <div class="card-content">
                    <img src="assets/imgs/Image_8.png" alt="imagem de ovos de páscoa coloridos">
                    <p>Páscoa</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="june-fest">
                  <div class="card-content">
                    <img src="assets/imgs/Image_1.png" alt="imagem de bandeiras de são joão penduradas">
                    <p>São João</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="halloween">
                  <div class="card-content">
                    <img src="assets/imgs/Image_9.png" alt="imagem de aboboras de halloween">
                    <p>Halloween</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="christmas">
                  <div class="card-content">
                    <img src="assets/imgs/Image_10.png" alt="imagem de presentes de natal">
                    <p>Natal</p>
                  </div>
                </div>
                  
                <div class="theme-card">
                  <input type="radio" name="event-theme" value="other">
                  <div class="card-content">
                    <img src="assets/imgs/Image_11.png" alt="imagem de pessoas brindando">
                    <p>Outro</p>
                  </div>
                </div>
                
              </div>
            </div>
          </fieldset>
2
          <fieldset>
            <legend>
              <img src="assets/icons/contact.svg" alt="">
              <span class="txt-h2">Dados para contato</span>
            </legend>


          </fieldset>
3
          <fieldset></fieldset>
        </form>

      </div>
    </main>

  </div>
</body>
</html>
