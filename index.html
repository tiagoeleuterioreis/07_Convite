<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festinha</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>

<body>
  <div id="app">
    <aside>
      <div class="aside-container">
        <header>
          <img src="assets/imgs/Logo.svg" alt="logo de festa">
          <h2 class="logo">Festivite</h2>
          <p class="txt-light">Crie um convite digital para o seu evento</p>
        </header>

      </div>
    </aside>

    <main>
      <div class="main-container">
        <h1>Crie seu convite</h1>

        <form action="" method="post" enctype="multipart/form-data">
          <fieldset class="about-info">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 1.25a.75.75 0 0 1 .75.75v1.25h6.5V2a.75.75 0 0 1 1.5 0v1.25H19A2.75 2.75 0 0 1 21.75 6v14A2.75 2.75 0 0 1 19 22.75H5A2.75 2.75 0 0 1 2.25 20V6A2.75 2.75 0 0 1 5 3.25h2.25V2A.75.75 0 0 1 8 1.25m-.75 3.5H5c-.69 0-1.25.56-1.25 1.25v3.25h16.5V6c0-.69-.56-1.25-1.25-1.25h-2.25V6a.75.75 0 0 1-1.5 0V4.75h-6.5V6a.75.75 0 0 1-1.5 0zm13 6H3.75V20c0 .69.56 1.25 1.25 1.25h14c.69 0 1.25-.56 1.25-1.25z" fill="#869198"/></svg>
            <legend>Sobre o evento</legend>

            <div class="input-wrapper">
              <label for="title">Título</label>
              <input 
              name="title" 
              id="title" 
              type="text"
              placeholder="Nome do evento">
            </div>

            <div class="input-wrapper">
              <label for="dateStart">Início</label>
              <input type="datetime-local" id="dateStart" type="dateStart" name="dateStart" lang="pt-BR">

              <label for="dateEnd">Fim</label>
              <input type="datetime-local" id="dateEnd" type="dateEnd" name="dateEnd" lang="pt-BR">
            </div>

            <div class="input-wrapper">
              <label>Tipo</label>
              <div class="radio-wrapper">
                <div class="radio-inner">
                  <div class="radio-image">
                    <label for="meet-type">Presencial</label>
                    <input type="radio" name="meet-type">
                  </div>
                </div>

                <div class="radio-inner">
                  <div class="radio-image">
                    <label for="meet-type">Online</label>
                    <input type="radio" name="meet-type">
                  </div>
                </div>
              </div>
            </div>

            <div class="input-wrapper">
              <label for="place-link">Local</label>
              <input type="url" name="place-link" id="place-link" placeholder="Link ou endereço">
            </div>

            <div class="txtArea-wrapper">
              <label for="description">Descrição</label>
              <textarea name="medical-info" id="medical-info"
              cols="30" rows="10"
              placeholder="Escreva sobre os detalhes do evento"
              ></textarea>
            </div>

          </fieldset>

        </form>

      </div>
    </main>

  </div>
</body>
</html>
